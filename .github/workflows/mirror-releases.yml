name: Mirror Releases

# Runs only in this public release repo (vlT-vl/pmxtools-release). Polls the
# private source repo vlT-vl/pmxtools for releases not yet mirrored here and
# republishes each one as an exact copy (same tag, same assets, changelog
# section as notes). No source code is ever copied: only release assets and
# the matching CHANGELOG.md section.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: mirror-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    name: Mirror releases
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_TOKEN: ${{ secrets.PRIVATE_REPOS_READ_TOKEN }}
      SOURCE_REPO: vlT-vl/pmxtools
    steps:
      - name: Mirror non-draft releases not yet copied here
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "::error::PRIVATE_REPOS_READ_TOKEN secret is not set on this repo — cannot read ${SOURCE_REPO}."
            exit 1
          fi

          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/${SOURCE_REPO}/releases" --paginate \
            --jq '.[] | select(.draft==false) | [.tag_name, .prerelease] | @tsv' \
            > /tmp/source-releases.tsv

          if [ ! -s /tmp/source-releases.tsv ]; then
            echo "no releases found on ${SOURCE_REPO} yet"
            exit 0
          fi

          while IFS=$'\t' read -r tag prerelease; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "already mirrored: ${tag}"
              continue
            fi

            echo "mirroring ${SOURCE_REPO}@${tag}"
            rm -rf /tmp/mirror-assets
            mkdir -p /tmp/mirror-assets
            GH_TOKEN="$SOURCE_TOKEN" gh release download "$tag" --repo "$SOURCE_REPO" --dir /tmp/mirror-assets --clobber

            changelog="$(GH_TOKEN="$SOURCE_TOKEN" gh api --method GET "repos/${SOURCE_REPO}/contents/CHANGELOG.md" -f ref="$tag" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)"
            notes=""
            if [ -n "$changelog" ]; then
              notes="$(printf '%s' "$changelog" | awk -v heading="## ${tag}" '
                index($0, heading) == 1 { found=1; next }
                found && /^## / { exit }
                found { print }
              ')"
            fi
            if [ -z "$(printf '%s' "$notes" | tr -d "[:space:]")" ]; then
              notes="No changelog entry recorded for this release."
            fi

            flags=""
            if [ "$prerelease" = "true" ]; then flags="--prerelease"; fi

            gh release create "$tag" /tmp/mirror-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "$notes" \
              $flags
          done < /tmp/source-releases.tsv
